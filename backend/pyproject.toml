[project]
name = "ecomonitor-study-server"
version = "0.1.0"
description = "Server REST dello studio EcoMonitor"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "mypy"]

[project.scripts]
ecomonitor-study-admin = "study_server.admin:main"
ecomonitor-study-grid = "study_server.grid:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["study_server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
files = ["study_server", "registry"]
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
