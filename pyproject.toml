[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecomonitor"
version = "0.1.0"
description = "Monitoraggio del consumo energetico e delle emissioni di CO2-eq di laptop/desktop (tesi triennale, green computing)"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "psutil>=5.9",
    "platformdirs>=4.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
]
windows = [
    "HardwareMonitor>=1.2",
]
packaging = [
    #serve su entrambi i sistemi: lo stesso spec costruisce Windows e Linux
    "pyinstaller>=6.22",
]
validation = [
    "zeroconf>=0.132",
    "cryptography>=42.0",
]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "types-psutil",
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
ecomonitor = "ecomonitor.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ecomonitor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
files = ["src/ecomonitor"]
#ruff non vede gli errori di tipo
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_optional = true

disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
#pythonnet/LibreHardwareMonitor e PySide6 non distribuiscono stub completi.

module = ["HardwareMonitor", "HardwareMonitor.*", "PySide6", "PySide6.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["trio", "trio.*", "pytest", "pytest.*", "_pytest", "_pytest.*", "numpy", "numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.ruff.lint]
ignore = [
    #giorni di cambio ora convertiti in utc danno problemi
    "DTZ005",
    "DTZ011",
    # pythonnet propaga le eccezioni .NET come Exception generiche: non c'e' un
    # tipo piu' stretto da catturare quando LibreHardwareMonitor fallisce
    "BLE001",
]
