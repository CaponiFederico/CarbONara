[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecomonitor"
version = "0.1.0"
description = "Monitoraggio del consumo energetico e delle emissioni di CO2-eq di laptop/desktop (tesi triennale, green computing)"
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9",
    "platformdirs>=4.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
]
windows = [
    "HardwareMonitor>=1.2",
]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
ecomonitor = "ecomonitor.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ecomonitor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    #giorni di cambio ora convertiti in utc danno problemi
    "DTZ005",
    "DTZ011",
    # pythonnet propaga le eccezioni .NET come Exception generiche: non c'e' un
    # tipo piu' stretto da catturare quando LibreHardwareMonitor fallisce
    "BLE001",
]
